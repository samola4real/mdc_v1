metadata:
  dataset_id: tasowheel_seed_v1
  version: "1.0"
  status: provider_confirmed_seed
  route_fields_included: false
  source_documents:
    - Questionnaire for MaaS Providers.docx
    - MaaSAI - Machine list - TSW (ID 199622).xlsx
  notes:
    - Route/operation sequence fields are excluded from v1.
    - Offering-level capability values come primarily from the TSW questionnaire.
    - Machine-list information is not used as offering-level search limits in v1.

providers:
  - provider_id: tasowheel
    legal_name: Tasowheel Oy
    display_name: Tasowheel Oy
    provider_type: MaaSProvider
    country: Finland
    source_type: provider_confirmed
    confidence: declared
    facilities:
      - facility_id: tasowheel_tampere
        city: Tampere
        country: Finland
        confidence: curated
        source_type: machine_list
    certifications:
      - code: ISO9001_2015
        label: ISO 9001:2015
        confidence: declared
        source_type: provider_confirmed
      - code: ISO14001_2015
        label: ISO 14001:2015
        confidence: declared
        source_type: provider_confirmed
      - code: ISO_TS_16949_partial
        label: Partial implementation of ISO/TS 16949
        confidence: declared
        source_type: provider_confirmed
      - code: APQP
        label: Advanced Product Quality Planning
        confidence: declared
        source_type: provider_confirmed

materials:
  - material_id: steel
    label: Steel
    ontology_concept: mdc:Steel
  - material_id: alloyed_carburizing_steel
    label: Alloyed carburizing steel
    ontology_concept: mdc:Steel
    parent_material_id: steel

material_grades:
  - grade_id: 18CrNiMo7-6
    label: 18CrNiMo7-6
    material_id: alloyed_carburizing_steel
    confidence: declared
    source_type: provider_confirmed
  - grade_id: 16MnCr5
    label: 16MnCr5
    material_id: alloyed_carburizing_steel
    confidence: declared
    source_type: provider_confirmed
  - grade_id: 20MnCr5
    label: 20MnCr5
    material_id: alloyed_carburizing_steel
    confidence: declared
    source_type: provider_confirmed

unsupported_or_unconfirmed_materials_for_tsw_v1:
  - material: aluminum
    reason: not confirmed by TSW questionnaire for this offering
  - material: titanium
    reason: not confirmed by TSW questionnaire for this offering
  - material: nickel_alloy
    reason: not confirmed by TSW questionnaire for this offering
  - material: stainless_steel
    reason: not confirmed by TSW questionnaire for this offering

offerings:
  - offering_id: tasowheel_gears_shafts_precision
    provider_id: tasowheel
    name: High-quality gears and shafts
    service_type: gear_manufacturing
    ontology_service_concept: mdc:GearTransmissionService
    source_type: provider_confirmed
    confidence: declared
    part_families:
      - gear
      - spur_gear
      - helical_gear
      - shaft
      - transmission_component
    processes:
      - machining
      - turning
      - milling
      - hobbing
      - gear_shaping
      - hard_turning
      - grinding
      - gear_grinding
      - heat_treatment
      - inspection
    supported_materials:
      - material: steel
        confidence: declared
        source_type: provider_confirmed
      - material: alloyed_carburizing_steel
        confidence: declared
        source_type: provider_confirmed
    supported_material_grades:
      - 18CrNiMo7-6
      - 16MnCr5
      - 20MnCr5
    capabilities:
      batch_size:
        min: 100
        max: 2000
        unit: pcs
        confidence: declared
        source_type: provider_confirmed
        source_note: TSW questionnaire states batch sizes 100-2000 pcs.
      diameter_mm:
        min: 10
        max: 450
        confidence: declared
        source_type: provider_confirmed
        source_note: TSW questionnaire states diameter range 10-450 mm.
      weight_kg:
        max: 200
        approximate: true
        confidence: declared
        source_type: provider_confirmed
        source_note: TSW questionnaire states weights up to approximately 200 kg.
      module:
        min: 0.3
        max: 10
        confidence: declared
        source_type: provider_confirmed
        source_note: TSW questionnaire states module range 0.3-10.
      diametral_pitch:
        min: 2.5
        max: 85
        raw: DP 85-2.5
        normalized_order: ascending
        confidence: declared
        source_type: provider_confirmed
        source_note: Raw DP value preserved from TSW questionnaire.
      quality:
        standard: DIN
        best_class: 4
        comparison_rule: lower_or_equal_is_better
        confidence: declared
        source_type: provider_confirmed
        source_note: TSW questionnaire states quality demands up to DIN4.
      lead_time_weeks:
        min: 8
        max: 12
        qualifier: normal_case_dependent
        confidence: declared
        source_type: provider_confirmed
        source_note: TSW questionnaire states normal delivery time is 8-12 weeks and depends on the case.
      surface_finish_ra_um:
        max: null
        confidence: unknown
        source_type: not_confirmed
        source_note: Surface roughness/Ra is not confirmed in v1 data.
      tolerance_mm:
        min: null
        confidence: unknown
        source_type: not_confirmed
        source_note: General ± tolerance is not confirmed; DIN4 must not be converted to mm tolerance.
      traceability:
        aerospace_traceability: null
        full_traceability: null
        confidence: unknown
        source_type: not_confirmed
        source_note: Traceability beyond certifications is not confirmed in v1.
    notes:
      - TSW specializes in manufacturing power transmission components, especially gears and shafts.
      - Heat treatment is included as a process capability but is subcontracting-related and should not be exposed as route information in v1.
      - The route sequence is intentionally excluded from v1 search and API responses.
